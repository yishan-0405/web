        <script>
            window.addEventListener("DOMContentLoaded", function() { //type為load時
                var board = document.getElementById("board");
                for (var y = 0; y < 14; y++) {
                    for (var x = 0; x < 14; x++) {
                        var a = document.createElement("div");
                        a.className = "target";
                        a.style.left = (x * 40) + "px";
                        a.style.top = ( y * 40) + "px";
                        board.appendChild(a);
                        a.id=x+"-"+y; /*之後用id檢查*/  
                    }
                }
            });

            turnblack = true; /*黑子先下*/
            x=0;//解決第一下無法下棋的問題
            gamestart=false;

            function black(elm){

                while(x==0){
                    alert("開始START~~~!");
                    x++;
                    gamestart=true;
                }

                document.getElementById("board").addEventListener("click", function(event) {
                    console.log(event.target.id); 

                if(gamestart==false) return; //如果遊戲沒開始就不執行

                    if (event.target.className === "target") { //如果已經變過顏色 classname會變成black or white

                        if (turnblack == true) {
                            event.target.classList.add("black");
                            setTimeout(function(){ //100ms後執行checkblack
                                checkblack();
                            },100);
                            turnblack = false; /*換白子下*/
                            
                        }else if (turnblack == false) {
                            event.target.classList.add("white");
                            turnblack = true; /*換黑子下*/
                            setTimeout(function(){ //100ms後執行checkwhite
                                checkwhite();
                            },100);
    
                        }
                    }else if (event.target.classList.contains("black") || event.target.classList.contains("white")) { 
                        alert("這裡已經有棋子了！");
                    }else{
                        alert("請點擊棋盤線交點！");//按到其他地方
                    }

                },{once:true});//執行一次就把被點擊的event.target清除 才不會重複執行
                
            }

            function checkblack(){
                //x同 直排
                for(var x=0;x<14;x++){
                    for(var y=0;y<10;y++){ 
                        if(document.getElementById(x+"-"+y).classList.contains("black")&&  
                        document.getElementById(x+"-"+(y+1)).classList.contains("black")&&
                        document.getElementById(x+"-"+(y+2)).classList.contains("black")&&
                        document.getElementById(x+"-"+(y+3)).classList.contains("black")&&
                        document.getElementById(x+"-"+(y+4)).classList.contains("black")){
                            endingblack();
                        }
                    }
                }
                //y同 橫
                for(var y=0;y<14;y++){
                    for(var x=0;x<10;x++){
                        if(document.getElementById(x+"-"+y).classList.contains("black")&&  
                        document.getElementById((x+1)+"-"+y).classList.contains("black")&&
                        document.getElementById((x+2)+"-"+y).classList.contains("black")&&
                        document.getElementById((x+3)+"-"+y).classList.contains("black")&&
                        document.getElementById((x+4)+"-"+y).classList.contains("black")){
                            endingblack();
                        }
                    }
                }
                //斜向右下
                for(var x=0;x<10;x++){
                    for(var y=0;y<10;y++){
                        if(document.getElementById(x+"-"+y).classList.contains("black")&&  
                        document.getElementById((x+1)+"-"+(y+1)).classList.contains("black")&&
                        document.getElementById((x+2)+"-"+(y+2)).classList.contains("black")&&
                        document.getElementById((x+3)+"-"+(y+3)).classList.contains("black")&&
                        document.getElementById((x+4)+"-"+(y+4)).classList.contains("black")){
                            endingblack();
                        }
                    }
                }
                //斜向左下
                for(var x=13;x>=4;x--){
                    for(var y=0;y<10;y++){
                        if(document.getElementById(x+"-"+y).classList.contains("black")&&  
                        document.getElementById((x-1)+"-"+(y+1)).classList.contains("black")&&
                        document.getElementById((x-2)+"-"+(y+2)).classList.contains("black")&&
                        document.getElementById((x-3)+"-"+(y+3)).classList.contains("black")&&
                        document.getElementById((x-4)+"-"+(y+4)).classList.contains("black")){
                            endingblack();
                        }
                    }
                }
            }
            function checkwhite(){
                //x同 直排
                for(var x=0;x<14;x++){
                    for(var y=0;y<10;y++){ 
                        if(document.getElementById(x+"-"+y).classList.contains("white")&&  
                        document.getElementById(x+"-"+(y+1)).classList.contains("white")&&
                        document.getElementById(x+"-"+(y+2)).classList.contains("white")&&
                        document.getElementById(x+"-"+(y+3)).classList.contains("white")&&
                        document.getElementById(x+"-"+(y+4)).classList.contains("white")){
                            endingwhite();
                        }
                    }
                }
                //y同 橫
                for(var y=0;y<14;y++){
                    for(var x=0;x<10;x++){
                        if(document.getElementById(x+"-"+y).classList.contains("white")&&  
                        document.getElementById((x+1)+"-"+y).classList.contains("white")&&
                        document.getElementById((x+2)+"-"+y).classList.contains("white")&&
                        document.getElementById((x+3)+"-"+y).classList.contains("white")&&
                        document.getElementById((x+4)+"-"+y).classList.contains("white")){
                            endingwhite();
                        }
                    }
                }
                //斜向右下
                for(var x=0;x<10;x++){
                    for(var y=0;y<10;y++){
                        if(document.getElementById(x+"-"+y).classList.contains("white")&&  
                        document.getElementById((x+1)+"-"+(y+1)).classList.contains("white")&&
                        document.getElementById((x+2)+"-"+(y+2)).classList.contains("white")&&
                        document.getElementById((x+3)+"-"+(y+3)).classList.contains("white")&&
                        document.getElementById((x+4)+"-"+(y+4)).classList.contains("white")){
                            endingwhite();
                        }
                    }
                }
                //斜向左下
                for(var x=13;x>=4;x--){
                    for(var y=0;y<10;y++){
                        if(document.getElementById(x+"-"+y).classList.contains("white")&&
                        document.getElementById((x-1)+"-"+(y+1)).classList.contains("white")&&
                        document.getElementById((x-2)+"-"+(y+2)).classList.contains("white")&&
                        document.getElementById((x-3)+"-"+(y+3)).classList.contains("white")&&
                        document.getElementById((x-4)+"-"+(y+4)).classList.contains("white")){
                            endingwhite();
                        }
                    }
                }
            }
            
            function endingblack(){
                alert("黑子勝！");
                gamestart=false;
            }
            function endingwhite(){
                alert("白子勝！");
                gamestart=false;
            }
