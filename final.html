        <script>
            window.addEventListener("DOMContentLoaded", function() {
                var board = document.getElementById("board");
                for (var y = 0; y < 14; y++) {
                    for (var x = 0; x < 14; x++) {
                        var a = document.createElement("div");
                        a.className = "target";
                        a.style.left = (x * 40) + "px";
                        a.style.top = ( y * 40) + "px";
                        board.appendChild(a);
                        a.id=x+"-"+y; /*之後用id檢查*/  
                    }

            });

            turnblack = true; /*黑子先下*/

            function black(elm){
                //把第一次按下去alert遊戲開始 且只一次
                //暗地一下時不會動 但是有執行black 沒有執行後面
                document.getElementById("board").addEventListener("click", function(event) {
                    console.log(event.target.id); 
                    if (event.target.className === "target") {
                        if (turnblack == true) {
                            console.log("黑子下了");
                            if(event.target.backgroundColor == "transparent" ){
                                alert("這裡已經有棋子了！");
                            } else {
                                event.target.classList.add("black");
                            }
                            //錯誤event.target.style.backgroundColor = "black";
                            turnblack = false; /*換白子下*/

                            console.log("白子下了");

                            } else {

                            }
                            //event.target.style.backgroundColor = "white";
                            turnblack = true;// /*換黑子下*/

                    }
